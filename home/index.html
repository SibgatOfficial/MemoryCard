<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NovaCut — GPU Video Editor</title>
    <style>
      :root {
        --bg: #07090d;
        --panel: #0d1117;
        --panel-2: #121822;
        --panel-3: #19202c;
        --line: #212a38;
        --line-2: #2d394b;
        --text: #e9edf5;
        --muted: #8892a4;
        --accent: #7c5cff;
        --accent-2: #00e0ff;
        --danger: #ff4d6d;
        --ok: #2ee6a8;
        --clip-a: #3a5bff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a3444;
        border-radius: 8px;
        border: 2px solid var(--bg);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a475c;
      }

      #app {
        display: grid;
        grid-template-rows: 54px 1fr 280px;
        height: 100vh;
      }

      /* ---------- TOP BAR ---------- */
      #topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        background: linear-gradient(180deg, #0f141c, #0b0f15);
        border-bottom: 1px solid var(--line);
        position: relative;
        z-index: 50;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 15px;
        letter-spacing: 0.3px;
      }
      .brand b {
        color: var(--accent-2);
      }
      .logo {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: conic-gradient(
          from 200deg,
          #7c5cff,
          #00e0ff,
          #2ee6a8,
          #7c5cff
        );
        box-shadow: 0 0 18px rgba(124, 92, 255, 0.55);
        position: relative;
      }
      .logo::after {
        content: "";
        position: absolute;
        inset: 6px;
        border-radius: 4px;
        background: #0b0f15;
      }
      .logo::before {
        content: "";
        position: absolute;
        left: 11px;
        top: 9px;
        z-index: 2;
        opacity: 0.95;
        border-left: 6px solid #fff;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
      }
      .tb-sep {
        width: 1px;
        height: 24px;
        background: var(--line-2);
      }
      .proj-name {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 7px;
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        padding: 6px 10px;
        width: 190px;
        font-family: inherit;
        outline: none;
        transition: 0.15s;
      }
      .proj-name:hover {
        border-color: var(--line-2);
      }
      .proj-name:focus {
        border-color: var(--accent);
        background: var(--panel-2);
      }
      .tb-spacer {
        flex: 1;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 9px;
        border: 1px solid var(--line-2);
        background: var(--panel-2);
        color: var(--text);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: 0.15s;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--panel-3);
        border-color: #3d4a60;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.primary {
        background: linear-gradient(135deg, #7c5cff, #5b3ce8);
        border-color: #8f74ff;
        box-shadow: 0 4px 16px rgba(124, 92, 255, 0.35);
      }
      .btn.primary:hover {
        background: linear-gradient(135deg, #8b6dff, #6a4bf0);
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.ghost:hover {
        background: var(--panel-2);
      }
      .btn.sm {
        padding: 5px 10px;
        font-size: 11.5px;
        border-radius: 7px;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ---------- MAIN ---------- */
      main {
        display: grid;
        grid-template-columns: 262px 1fr 306px;
        overflow: hidden;
        min-height: 0;
      }

      .panel {
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .panel.right {
        border-right: none;
        border-left: 1px solid var(--line);
      }
      .panel-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 13px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.1px;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .panel-head .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .panel-body {
        overflow-y: auto;
        overflow-x: hidden;
        flex: 1;
        min-height: 0;
      }

      /* ---------- MEDIA BIN ---------- */
      .dropzone {
        margin: 10px;
        padding: 20px 12px;
        border: 1.5px dashed var(--line-2);
        border-radius: 12px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        transition: 0.2s;
        cursor: pointer;
        line-height: 1.6;
      }
      .dropzone:hover {
        border-color: var(--accent);
        background: rgba(124, 92, 255, 0.07);
        color: #b9a8ff;
      }
      .dropzone .big {
        font-size: 24px;
        display: block;
        margin-bottom: 6px;
      }
      .dropzone.drag {
        border-color: var(--accent-2);
        background: rgba(0, 224, 255, 0.09);
        color: var(--accent-2);
      }

      .bin-grid {
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .media-item {
        display: flex;
        gap: 9px;
        padding: 7px;
        border-radius: 9px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: 0.13s;
        background: var(--panel-2);
        align-items: center;
      }
      .media-item:hover {
        background: var(--panel-3);
        border-color: var(--line-2);
        transform: translateX(2px);
      }
      .media-item .thumb {
        width: 62px;
        height: 38px;
        border-radius: 6px;
        overflow: hidden;
        background: #000;
        flex-shrink: 0;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .media-item .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .media-item .thumb .dur {
        position: absolute;
        bottom: 2px;
        right: 2px;
        background: rgba(0, 0, 0, 0.78);
        font-size: 9px;
        padding: 1px 4px;
        border-radius: 3px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .media-item .meta {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
      }
      .media-item .nm {
        font-size: 11.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .media-item .sub {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.2px;
      }
      .media-item .badge {
        font-size: 9px;
        padding: 1px 5px;
        border-radius: 4px;
        background: #22304a;
        color: #8fb6ff;
        align-self: flex-start;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      /* ---------- PREVIEW ---------- */
      .stage {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: radial-gradient(circle at 50% 0%, #151b27 0%, #080b11 70%);
      }
      .stage-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        min-height: 0;
        position: relative;
        overflow: hidden;
      }
      .stage-area::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.022) 1px,
            transparent 1px
          );
        background-size: 34px 34px;
      }
      #preview {
        max-width: 100%;
        max-height: 100%;
        border-radius: 8px;
        display: block;
        position: relative;
        z-index: 1;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.75),
          0 0 0 1px rgba(255, 255, 255, 0.07);
        background: #000;
      }

      /* ---------- TRANSPORT ---------- */
      .transport {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border-top: 1px solid var(--line);
        background: var(--panel);
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .tbtn {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        border: 1px solid var(--line-2);
        background: var(--panel-2);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.13s;
        font-size: 14px;
      }
      .tbtn:hover {
        background: var(--panel-3);
        border-color: #3d4a60;
      }
      .tbtn.play {
        background: linear-gradient(135deg, #7c5cff, #5b3ce8);
        border-color: #8f74ff;
        width: 40px;
        height: 40px;
        font-size: 15px;
      }
      .tbtn.play:hover {
        background: linear-gradient(135deg, #8b6dff, #6a4bf0);
      }
      .tc {
        font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
        font-size: 13px;
        letter-spacing: 0.6px;
        color: var(--text);
        background: var(--panel-2);
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
      }
      .tc .dim {
        color: var(--muted);
      }
      .spacer {
        flex: 1;
      }
      .ratio-pills {
        display: flex;
        gap: 4px;
        background: var(--panel-2);
        padding: 3px;
        border-radius: 9px;
        border: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .pill {
        padding: 5px 9px;
        border-radius: 6px;
        font-size: 10.5px;
        font-weight: 700;
        cursor: pointer;
        color: var(--muted);
        transition: 0.13s;
        letter-spacing: 0.3px;
        border: none;
        background: transparent;
        font-family: inherit;
      }
      .pill:hover {
        color: var(--text);
        background: var(--panel-3);
      }
      .pill.active {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 2px 10px rgba(124, 92, 255, 0.45);
      }

      /* ---------- INSPECTOR ---------- */
      .insp {
        padding: 12px;
      }
      .section {
        margin-bottom: 16px;
      }
      .section-title {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.1px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 9px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .field {
        margin-bottom: 10px;
      }
      .field label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: #9aa5b8;
        margin-bottom: 5px;
        font-weight: 600;
      }
      .field .val {
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        color: var(--accent-2);
        background: #0c1520;
        padding: 1px 6px;
        border-radius: 4px;
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 4px;
        background: linear-gradient(90deg, #3a4658, #2a3444);
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #b6a6ff, #7c5cff);
        border: 2px solid #0d1117;
        box-shadow: 0 0 8px rgba(124, 92, 255, 0.7);
        cursor: pointer;
        transition: 0.1s;
      }
      input[type="range"]::-webkit-slider-thumb:hover {
        transform: scale(1.18);
      }
      input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #7c5cff;
        border: 2px solid #0d1117;
        cursor: pointer;
      }
      select,
      input[type="number"],
      input[type="text"] {
        width: 100%;
        background: var(--panel-2);
        border: 1px solid var(--line-2);
        color: var(--text);
        padding: 7px 9px;
        border-radius: 7px;
        font-family: inherit;
        font-size: 12px;
        outline: none;
        transition: 0.13s;
      }
      select:focus,
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.16);
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .row3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
      }
      .empty-state {
        padding: 26px 18px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }
      .empty-state .ico {
        font-size: 30px;
        display: block;
        margin-bottom: 10px;
        opacity: 0.5;
      }
      .kbd {
        display: inline-block;
        background: var(--panel-3);
        border: 1px solid var(--line-2);
        border-radius: 4px;
        padding: 0 5px;
        font-size: 10px;
        font-family: monospace;
        color: #b9c3d6;
      }

      /* ---------- TIMELINE ---------- */
      #timeline {
        background: var(--panel);
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
        position: relative;
        z-index: 20;
      }
      .tl-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
        background: #0b0f15;
      }
      .tl-toolbar .sep {
        width: 1px;
        height: 18px;
        background: var(--line-2);
        margin: 0 3px;
      }
      .zoom-wrap {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        color: var(--muted);
      }
      .zoom-wrap input[type="range"] {
        width: 90px;
      }

      .tl-main {
        flex: 1;
        display: flex;
        min-height: 0;
        overflow: hidden;
      }
      .tl-headers {
        width: 112px;
        flex-shrink: 0;
        border-right: 1px solid var(--line);
        background: #0a0e14;
        display: flex;
        flex-direction: column;
      }
      .tl-ruler-spacer {
        height: 26px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .track-header {
        height: 56px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 11px;
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
        flex-shrink: 0;
      }
      .track-header .tico {
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background: var(--clip-a);
        flex-shrink: 0;
      }
      .track-header.audio .tico {
        background: var(--ok);
      }

      .tl-scroll {
        flex: 1;
        overflow-x: auto;
        overflow-y: hidden;
        position: relative;
        min-width: 0;
      }
      .tl-inner {
        position: relative;
        min-height: 100%;
      }
      .tl-ruler {
        height: 26px;
        border-bottom: 1px solid var(--line);
        position: relative;
        background: #0a0e14;
        cursor: pointer;
      }
      .tick {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #1e2734;
      }
      .tick span {
        position: absolute;
        left: 5px;
        top: 6px;
        font-size: 9.5px;
        color: #6d7889;
        font-family: "JetBrains Mono", monospace;
        white-space: nowrap;
        letter-spacing: 0.3px;
      }
      .tl-track {
        height: 56px;
        border-bottom: 1px solid var(--line);
        position: relative;
        background: repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 39px,
          rgba(255, 255, 255, 0.014) 39px,
          rgba(255, 255, 255, 0.014) 40px
        );
      }
      .tl-track.audio {
        background: rgba(46, 230, 168, 0.02);
      }

      .clip {
        position: absolute;
        top: 5px;
        bottom: 5px;
        border-radius: 7px;
        overflow: hidden;
        cursor: grab;
        border: 1.5px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.45);
        background: linear-gradient(180deg, #3a5bff, #2b45c4);
        transition:
          box-shadow 0.12s,
          border-color 0.12s;
      }
      .clip:hover {
        border-color: rgba(255, 255, 255, 0.42);
      }
      .clip.sel {
        border-color: #fff;
        z-index: 5;
        box-shadow:
          0 0 0 2px var(--accent-2),
          0 4px 18px rgba(0, 224, 255, 0.35);
      }
      .clip .clip-label {
        position: absolute;
        left: 8px;
        right: 8px;
        top: 5px;
        pointer-events: none;
        font-size: 10.5px;
        font-weight: 700;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        letter-spacing: 0.2px;
      }
      .clip .clip-sub {
        position: absolute;
        left: 8px;
        bottom: 4px;
        font-size: 9px;
        color: rgba(255, 255, 255, 0.72);
        font-family: "JetBrains Mono", monospace;
        pointer-events: none;
        letter-spacing: 0.3px;
      }
      .clip .handle {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 9px;
        cursor: ew-resize;
        z-index: 3;
      }
      .clip .handle::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 3px;
        height: 16px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.55);
      }
      .clip .handle.l {
        left: 0;
      }
      .clip .handle.r {
        right: 0;
      }
      .clip:hover .handle::after {
        background: #fff;
      }
      .clip.sel .handle::after {
        background: var(--accent-2);
      }

      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--danger);
        pointer-events: none;
        z-index: 30;
        box-shadow: 0 0 10px rgba(255, 77, 109, 0.85);
      }
      .playhead::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 9px solid var(--danger);
      }

      /* ---------- MODAL ---------- */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(4, 6, 10, 0.82);
        backdrop-filter: blur(7px);
        z-index: 200;
        display: none;
        align-items: center;
        justify-content: center;
      }
      .overlay.show {
        display: flex;
        animation: fade 0.18s ease;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .modal {
        background: linear-gradient(180deg, #141a24, #0e131b);
        border: 1px solid var(--line-2);
        border-radius: 16px;
        width: 480px;
        max-width: 92vw;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8);
        animation: pop 0.2s cubic-bezier(0.2, 1.2, 0.4, 1);
        overflow: hidden;
      }
      @keyframes pop {
        from {
          transform: scale(0.94) translateY(10px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .modal-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 700;
        font-size: 14px;
      }
      .modal-body {
        padding: 18px 20px;
        max-height: 66vh;
        overflow-y: auto;
      }
      .modal-foot {
        padding: 14px 20px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 9px;
        justify-content: flex-end;
        background: #0b0f15;
      }
      .x-btn {
        background: transparent;
        border: none;
